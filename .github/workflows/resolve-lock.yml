name: Resolve package lock

on:
  push:
    branches:
      - issue-12-public-mcp-dogfood

permissions:
  contents: read

jobs:
  resolve-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Record resolved MCP SDK versions
        shell: bash
        run: |
          node --version
          npm --version
          node -e "const l=require('./package-lock.json'); console.log('client='+l.packages['node_modules/@modelcontextprotocol/client'].version); console.log('server='+l.packages['node_modules/@modelcontextprotocol/server'].version)"
      - name: Upload resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: resolved-package-lock-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
