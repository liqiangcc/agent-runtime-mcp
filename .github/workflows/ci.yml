name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  typecheck-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Upload resolved npm lockfile
        if: ${{ hashFiles('package-lock.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: npm-lock-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error

  tmux-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          tmux -V
      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install
          fi
      - name: Real isolated tmux integration
        run: npm run test:integration

  static-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject lifecycle/raw-command product escape hatches
        shell: bash
        run: |
          prohibited='list_workers|create_worker|restart_worker|destroy_worker|assign_task|claim_task|tmux_command|run_shell_command|new-session|new-window|split-window|kill-session|kill-pane|respawn-pane'
          if grep -R -n -E "$prohibited" src; then
            echo 'Product boundary violation detected in src/' >&2
            exit 1
          fi
          echo 'Static Channel boundary check passed.'
