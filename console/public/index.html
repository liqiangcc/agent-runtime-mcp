<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-runtime console</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <h1>Channels</h1>
  <div id="health" class="banner checking">checking backend…</div>
  <div class="controls">
    <button id="refresh" type="button">Refresh</button>
    <label class="auto">
      <input type="checkbox" id="auto" checked>
      auto refresh
    </label>
    <select id="interval" aria-label="refresh interval">
      <option value="5000">5s</option>
      <option value="10000" selected>10s</option>
      <option value="30000">30s</option>
    </select>
  </div>
</header>
<main>
  <p id="error" class="error" hidden></p>
  <p id="empty" class="empty" hidden>No channels in scope.</p>
  <ul id="channels" class="channel-list"></ul>
</main>
<footer id="composer" class="composer" hidden>
  <div class="composer-target">
    to <span id="composer-target" class="composer-target-name"></span>
    <button id="composer-close" type="button" class="composer-close" aria-label="clear selection">×</button>
  </div>
  <div id="send-result" class="send-result" hidden></div>
  <textarea id="composer-text" rows="2" placeholder="Message… (Enter sends · Shift+Enter for a newline)"></textarea>
  <div class="composer-actions">
    <button id="send" type="button" class="primary">Send</button>
    <label class="hint"><input type="checkbox" id="no-submit"> send without Enter</label>
    <span id="size-hint" class="size-hint"></span>
    <span class="spacer"></span>
    <button id="control-stop" type="button" class="danger">Stop</button>
    <button id="control-enter" type="button">Enter</button>
    <button id="control-escape" type="button">Escape</button>
  </div>
</footer>
<script src="/app.js" defer></script>
</body>
</html>
